<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Rescue - לוח בקרה</title>
    <link rel="stylesheet" href="../styles/game.css">
</head>
<body>

    <div id="startModal" class="modal">
        <div class="modal-content">
            <h2>מוכנה למשימה? 🚀</h2>
            <p>עזרי לחללית לפענח את הקוד הסודי.</p>
            <button id="startGameBtn" class="action-btn">התחל משחק</button>
        </div>
    </div>

    <div id="winModal" class="modal">
        <div class="modal-content success">
            <h2>כל הכבוד, אסטרונאוטית! 🏆</h2>
            <p>הקוד פוצח והחללית ניצלה.</p>
            <p>מוכנה לאתגר גדול יותר?</p>
            <button id="nextLevelBtn" class="action-btn">עבור לשלב הבא</button>
        </div>
    </div>

    <div id="loseModal" class="modal">
        <div class="modal-content danger">
            <h2>המשימה נכשלה... 🛸</h2>
            <p>הזמן נגמר והחללית התרחקה.</p>
            <button id="restartBtn" class="action-btn">נסה שוב</button>
            <button id="backToMenuBtn" class="action-btn secondary">חזרה לתפריט</button>
        </div>
    </div>

    <header>
        <div id="playerInfo">אסטרונאוט/ית: <span id="displayPlayerName">---</span></div>
        <div id="stats">
            <div class="stat-item">זמן נותר: <span id="timer">00:60</span></div>
            <div class="stat-item">ניסיונות: <span id="attempts">0</span></div>
            <div class="stat-item">שלב: <span id="levelDisplay">1</span></div>
        </div>
    </header>

    <main id="gameBoard">
        <div id="inputArea"></div>

        <div id="feedbackArea">
            <h3>היסטוריית פיענוח:</h3>
            <ul id="historyList"></ul>
        </div>
    </main>

    <script type="module" src="../scripts/game.js"></script>
</body>
</html>
